server {
    listen 8080;
    server_name the-pool-lab.com www.the-pool-lab.com;

    port_in_redirect off;
    server_name_in_redirect off;

    if ($http_x_forwarded_proto = 'http') {
        return 301 https://www.the-pool-lab.com$request_uri;
    }
    if ($host = 'the-pool-lab.com') {
        return 301 https://www.the-pool-lab.com$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}