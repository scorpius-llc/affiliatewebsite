server {
    listen 8080;
    server_name thermapeak.com www.thermapeak.com thermapeak-test-925569592209.us-east1.run.app;

    # --- Proxy Directives ---
    port_in_redirect off;
    server_name_in_redirect off;

    # --- Canonical Redirect Logic ---
    # 1. If the request is HTTP, redirect to HTTPS on the same host.
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
    }
    # 2. If the request is for the apex domain, redirect to the 'www' version.
    if ($host = 'thermapeak.com') {
        return 301 https://www.thermapeak.com$request_uri;
    }

    # --- Legacy Review URL Normalization ---
    location = /reviews/SunHome-Cold-Plunge-Pro { return 301 /reviews/sunhome-cold-plunge-pro; }
    location = /reviews/SunHome-Cold-Plunge-Portable-Horizontal { return 301 /reviews/sunhome-cold-plunge-portable-horizontal; }
    location = /reviews/Plunge-Standard { return 301 /reviews/plunge-standard; }
    location = /reviews/Plunge-All-In { return 301 /reviews/plunge-all-in; }
    location = /reviews/Renu-Cold-Stoic-Classic { return 301 /reviews/renu-cold-stoic-classic; }
    location = /reviews/Renu-Cold-Stoic-2-0 { return 301 /reviews/renu-cold-stoic-2-0; }
    location = /reviews/EdgeTheoryLabs-Tub-Chiller-Setup { return 301 /reviews/edgetheorylabs-tub-chiller-setup; }
    location = /reviews/IceBarrel-Pro { return 301 /reviews/icebarrel-pro; }
    location = /reviews/PenguinChillers-Tub-Setup { return 301 /reviews/penguinchillers-tub-setup; }
    location = /reviews/IceBarrel-400 { return 301 /reviews/icebarrel-400; }
    location = /reviews/IceBarrel-300 { return 301 /reviews/icebarrel-300; }
    location = /reviews/TheColdPod-IceBath { return 301 /reviews/thecoldpod-icebath; }
    location = /reviews/GGanen-Ice-Bath-Tub { return 301 /reviews/gganen-ice-bath-tub; }
    location = /reviews/Polar-Recovery-Tub { return 301 /reviews/polar-recovery-tub; }
    location = /reviews/TuffStuff-Stock-Tank-100gal { return 301 /reviews/tuffstuff-stock-tank-100gal; }
    location = /reviews/Nurecover-Ice-Bath { return 301 /reviews/nurecover-ice-bath; }
    location = /reviews/Lumi-Recovery-Pod { return 301 /reviews/lumi-recovery-pod; }
    location = /reviews/VEVOR-Ice-Bath-Tub { return 301 /reviews/vevor-ice-bath-tub; }
    location = /reviews/CalmMax-Portable-Ice-Bath { return 301 /reviews/calmmax-portable-ice-bath; }
    location = /reviews/Hydragun-Supertub { return 301 /reviews/hydragun-supertub; }
    location = /reviews/SunHome-Equinox-2P-Infrared { return 301 /reviews/sunhome-equinox-2p-infrared; }
    location = /reviews/SunHome-Luminar-1P-Infrared { return 301 /reviews/sunhome-luminar-1p-infrared; }
    location = /reviews/Dynamic-Barcelona-1-2P { return 301 /reviews/dynamic-barcelona-1-2p; }
    location = /reviews/Dynamic-Andora-2P { return 301 /reviews/dynamic-andora-2p; }
    location = /reviews/JNH-Joyous-2P { return 301 /reviews/jnh-joyous-2p; }
    location = /reviews/SereneLife-Portable-Infrared { return 301 /reviews/serenelife-portable-infrared; }
    location = /reviews/HigherDOSE-Infrared-Sauna-Blanket { return 301 /reviews/higherdose-infrared-sauna-blanket; }
    location = /reviews/AlmostHeaven-Barrel-Morgan { return 301 /reviews/almostheaven-barrel-morgan; }
    location = /reviews/AlmostHeaven-Barrel-Salem { return 301 /reviews/almostheaven-barrel-salem; }
    location = /reviews/AlmostHeaven-Bluestone-3P { return 301 /reviews/almostheaven-bluestone-3p; }
    location = /reviews/Dundalk-Barrel-Sauna { return 301 /reviews/dundalk-barrel-sauna; }
    location = /reviews/ALEKO-Barrel-Sauna { return 301 /reviews/aleko-barrel-sauna; }
    location = /reviews/GoldenDesigns-Monaco-3P { return 301 /reviews/goldendesigns-monaco-3p; }
    location = /reviews/GoldenDesigns-Maxxus-2P { return 301 /reviews/goldendesigns-maxxus-2p; }
    location = /reviews/Dynamic-Venice-2P { return 301 /reviews/dynamic-venice-2p; }
    location = /reviews/JNH-Ensi-4P { return 301 /reviews/jnh-ensi-4p; }
    location = /reviews/Sunlighten-mPulse-Series { return 301 /reviews/sunlighten-mpulse-series; }
    location = /reviews/SunHome-Hybrid-Series { return 301 /reviews/sunhome-hybrid-series; }
    location = /reviews/Clearlight-Sanctuary-2 { return 301 /reviews/clearlight-sanctuary-2; }

    location = /guides/cold-plunge-water-maintenance { return 301 /guides/cold-plunge-maintenance-guide; }
    location = /guides/maintenance-care { return 301 /guides/cold-plunge-maintenance-guide; }
    location = /guides/buying-guides { return 301 /guides; }
    location = /guides/cleaning-operation { return 301 /guides; }

    location = /best-of/overall { return 301 /best-of/best-cold-plunge-tubs; }
    location = /best-of/value { return 301 /best-of/best-budget-cold-plunge; }
    location = /best-of/leaves { return 301 /best-of/best-cold-plunge-outdoor; }
    location = /best-of/above-ground { return 301 /best-of/best-cold-plunge-for-beginners; }
    location = /best-of/vinyl { return 301 /best-of/best-cold-plunge-tubs; }
    location = /best-of/inground { return 301 /best-of/best-cold-plunge-tubs; }

    # --- Trailing Slash Enforcement (NO SLASH) ---
    # 3. If the request has a trailing slash, permanently redirect to the non-slash version.
    if ($request_uri ~* "^(.+)/$") {
        return 301 $1;
    }

    # --- Content Serving ---
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # Specific location block for the homepage to ensure it loads.
    location = / {
        try_files /index.html =404;
    }

    # Location block for all other pages.
    location / {
        # Since we have no trailing slashes, we look for the .html file directly.
        try_files $uri $uri.html =404;
    }

    # Caching and other rules...
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-control "public, max-age=604800, immutable";
        expires 7d;
    }
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
