server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version information
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Disable caching for HTML and JSON files
    # This ensures users always get the latest content and product data
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache CSS, JS, and Images for 1 week
    # These files change less often, and we can use version strings (?v=1) to force updates
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    # Deny access to hidden files (like .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}