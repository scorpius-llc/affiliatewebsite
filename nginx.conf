server {
    listen 8080;
    server_name the-pool-lab.com www.the-pool-lab.com;

    # Enforce HTTPS and canonical WWW domain
    # 1. If the request is HTTP, redirect to the canonical HTTPS WWW URL.
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://www.the-pool-lab.com$request_uri;
    }
    # 2. If the request is already HTTPS but on the non-WWW apex domain, redirect to the WWW URL.
    if ($host = 'the-pool-lab.com') {
        return 301 https://www.the-pool-lab.com$request_uri;
    }

    # If we get here, the request is for https://www.the-pool-lab.com, so we serve content.
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version information
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
    # 'always' is removed from HSTS to prevent conflicts with redirects.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location / {
        try_files $uri $uri/ =404;
    }

    # Disable caching for HTML and JSON files
    # This ensures users always get the latest content and product data
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache CSS, JS, and Images for 1 week
    # These files change less often, and we can use version strings (?v=1) to force updates
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    # Deny access to hidden files (like .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}