server {
    listen 8080;

    # ==============================================================================
    # TODO: UPDATE FOR NEW SITE
    # Replace the domains below with the new site's apex and www domains.
    # ==============================================================================
    server_name the-pool-lab.com www.the-pool-lab.com;

    # --- Proxy Directives ---
    port_in_redirect off;
    server_name_in_redirect off;

    # --- Canonical Redirect Logic ---
    # 1. If the request is HTTP, redirect to HTTPS on the same host.
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
    }
    # 2. If the request is for the apex domain, redirect to the 'www' version.
    if ($host = 'the-pool-lab.com') {
        return 301 https://www.the-pool-lab.com$request_uri;
    }

    # --- Content Serving ---
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Caching and other rules...
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}